
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
.wrap{width:100%;padding:6px 4px 4px}
h2{font-size:13px;font-weight:700;color:var(--color-text-primary);margin-bottom:3px}
.topbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:3px;font-size:10px;color:var(--color-text-secondary)}
.li{display:inline-flex;align-items:center;gap:3px}
.ld{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
.controls{display:flex;align-items:center;gap:10px;margin-bottom:4px;flex-wrap:wrap}
.counter-bar{display:flex;align-items:center;gap:6px;padding:3px 8px;background:var(--color-background-secondary);border-radius:5px;border:0.5px solid var(--color-border-tertiary);flex-wrap:wrap;flex:1}
.counter-num{font-size:15px;font-weight:700;color:var(--color-text-primary);min-width:18px;text-align:center}
.counter-label{font-size:10px;color:var(--color-text-secondary);white-space:nowrap}
.counter-chips{display:flex;flex-wrap:wrap;gap:2px;flex:1;min-width:0}
.sel-tag{font-size:9px;padding:1px 5px;border-radius:3px;border:1px solid transparent;display:inline-flex;align-items:center;gap:2px;cursor:pointer}
.sel-tag:hover{opacity:0.75}
.xt{opacity:0.55}
.clear-btn{font-size:9px;padding:1px 7px;border-radius:4px;border:0.5px solid var(--color-border-secondary);background:transparent;color:var(--color-text-secondary);cursor:pointer;white-space:nowrap}
.clear-btn:hover{background:var(--color-background-secondary)}
.scale-ctrl{display:inline-flex;align-items:center;gap:6px;background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:5px;padding:3px 8px;white-space:nowrap;flex-shrink:0}
.scale-ctrl label{font-size:10px;color:var(--color-text-primary);font-weight:700}
.scale-ctrl input[type=range]{width:100px;cursor:pointer;accent-color:#3a88f0}
.scale-ctrl span{font-size:10px;color:var(--color-text-secondary);min-width:36px}
.tbl-outer{width:100%;overflow-x:auto;overflow-y:visible}
.tbl-scaler{transform-origin:top left;display:inline-block;white-space:nowrap}
table{border-collapse:collapse;white-space:nowrap}
th{padding:3px 5px;border:1px solid #7a9abf;background:#cde0f5;font-weight:700;font-size:10px;color:#1a3a5c;text-align:center;vertical-align:middle}
th.corner{text-align:left;cursor:default;width:90px;min-width:90px}
th.origin-th{cursor:grab;width:68px;min-width:68px;user-select:none}
th.origin-th:active{cursor:grabbing}
th.unique-th{width:90px;min-width:90px}
.oname{display:block;font-size:10px;font-weight:700;line-height:1.2}
.obp{display:flex;flex-wrap:wrap;gap:1px;justify-content:center;margin-top:2px}
.obpn{font-size:7px;padding:0 3px;border-radius:2px;font-weight:700;background:#a8c8e8;color:#1a3a5c;border:1px solid #7a9abf;line-height:12px;transition:background .15s,color .15s}
.obpn.reached{background:#f0a020;color:#fff;border-color:#c07800}
.hdr-count{display:inline-block;font-size:8px;font-weight:700;padding:0 3px;border-radius:8px;margin-bottom:2px;background:#f0a020;color:#fff;min-width:14px;text-align:center;line-height:13px;visibility:hidden}
.hdr-count.show{visibility:visible}
td{padding:2px 3px;border:1px solid #7a9abf;vertical-align:top;transition:background .12s}
td.cls{background:#cde0f5;font-weight:700;font-size:10px;color:#1a3a5c;text-align:center;vertical-align:middle;padding:3px 4px;width:90px;min-width:90px;border-right:2px solid #5580a8;cursor:grab;line-height:1.2;user-select:none}
td.cls:active{cursor:grabbing}
td.none-cls{background:#e8e8e8;color:#555;font-style:italic}
.bp{display:flex;flex-wrap:wrap;gap:1px;margin-top:2px;justify-content:center}
.bpn{font-size:7px;padding:0 3px;border-radius:2px;font-weight:700;background:#a8c8e8;color:#1a3a5c;border:1px solid #7a9abf;line-height:12px;transition:background .15s,color .15s}
.bpn.reached{background:#f0a020;color:#fff;border-color:#c07800}
.cls-count{display:inline-block;font-size:8px;font-weight:700;padding:0 3px;border-radius:8px;background:#f0a020;color:#fff;min-width:14px;text-align:center;line-height:13px;margin-top:2px;visibility:hidden}
.cls-count.show{visibility:visible}
tr.row-hover td{background:rgba(240,192,64,0.18)!important}
tr.row-hover td.cls{background:rgba(240,192,64,0.35)!important}
th.col-hover,td.col-hover{background:rgba(240,192,64,0.18)!important}
th.col-hover{background:rgba(240,192,64,0.35)!important}
tr.row-sel-hl td{background:rgba(240,160,32,0.07)}
tr.row-sel-hl td.cls{background:rgba(240,160,32,0.18)}
th.col-sel-hl,td.col-sel-hl{background:rgba(240,160,32,0.07)}
th.col-sel-hl{background:rgba(240,160,32,0.18)}
th.drag-over-col{outline:2px dashed #3a7abf;outline-offset:-2px}
tr.drag-over-row td{outline:2px dashed #3a7abf}
tr.dragging-row{opacity:0.35}
th.dragging-col{opacity:0.35}
.cell{display:flex;flex-direction:column;gap:1px}
.ch{display:inline-flex;align-items:center;gap:2px;padding:1px 4px 1px 2px;border-radius:3px;font-size:9px;white-space:nowrap;border:1px solid transparent;cursor:pointer;transition:box-shadow .1s,transform .08s}
.ch:hover{transform:scale(1.05)}
.ch img.portrait{width:18px;height:18px;border-radius:2px;object-fit:cover;flex-shrink:0;background:#ccc}
.c1{background:#f0f0f0;color:#222;border-color:#999}
.c2{background:#c8f5dc;color:#084d22;border-color:#3aaa66}
.c3{background:#c4dcff;color:#083580;border-color:#3a88f0}
.c4{background:#e8d4ff;color:#3a1080;border-color:#8844d0}
.c5{background:#fff0b0;color:#604000;border-color:#c8960c}
.ch.selected{box-shadow:0 0 0 2px #f0a020,0 0 5px 1px rgba(240,160,32,0.4);transform:scale(1.06);position:relative;z-index:2}
.tt{position:fixed;z-index:9999;background:#1a2a3a;color:#e8f0f8;font-size:10px;line-height:1.5;padding:7px 10px;border-radius:5px;border:1px solid #4a6a8a;max-width:300px;white-space:normal;pointer-events:none;display:none;box-shadow:0 2px 8px rgba(0,0,0,0.5)}
.tt-name{font-weight:700;color:#a8d0f8;font-size:11px;margin-bottom:2px}
.tt-sub{font-size:9px;color:#88aac8;margin-bottom:4px}
.tt-section{font-size:9px;color:#a8d0f8;font-weight:700;margin:5px 0 3px}
.tt-desc{font-size:10px;color:#ddeeff;margin-bottom:3px}
.tt-items{display:flex;gap:6px;align-items:flex-start;margin:2px 0}
.tt-item-wrap{display:flex;flex-direction:column;align-items:center;gap:2px;width:50px}
.tt-item-wrap img{width:30px;height:30px;border-radius:4px;border:1px solid #4a6a8a;display:block}
.tt-item-wrap span{font-size:8px;color:#88aac8;text-align:center;line-height:1.2;word-break:break-word}
.tt-origin-divider{border-top:1px solid #2a4a6a;margin:5px 0}
.tt-bps{margin-top:3px}
.tt-bps ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:2px}
.tt-bps ul li{font-size:9px;color:#c0d8f0;display:flex;align-items:baseline;gap:5px}
.tt-bps ul li b{background:#2a4a6a;color:#a8d0f8;font-size:8px;padding:0 4px;border-radius:3px;line-height:14px;white-space:nowrap;flex-shrink:0}
</style>

  colOrder.forEach((o,ci)=>{const bpData=originBP[o];const bpArr=bpData?getBpArr(bpData.tiers):[];const bps=bpArr.map(n=>`<span class="obpn" data-bp="${n}">${n}</span>`).join("");const isUniq=o==="Unique";h+=`<th class="origin-th${isUniq?" unique-th":""}" data-ci="${ci}" draggable="${!isUniq}" data-o="${o}"><span class="hdr-count">0</span><span class="oname">${isUniq?"Unique Origins":o}</span>${bps?`<div class="obp">${bps}</div>`:""}</th>`;});
  h+=`</tr></thead><tbody>`;
  rowOrder.forEach((cl,ri)=>{const isNone=cl==="None";const bpData=classBP[cl];const bpArr=bpData?getBpArr(bpData.tiers):[];const bps=bpArr.map(n=>`<span class="bpn" data-bp="${n}">${n}</span>`).join("");h+=`<tr data-ri="${ri}" draggable="true"><td class="cls${isNone?" none-cls":""}" data-ri="${ri}" data-cl="${cl}"><div>${isNone?"None":cl}</div>${bps?`<div class="bp">${bps}</div>`:""}<span class="cls-count">0</span></td>`;colOrder.forEach((o,ci)=>{const list=(lk[`${cl}|${o}`]||[]).sort((a,b)=>a.c-b.c);if(!list.length){h+=`<td data-ri="${ri}" data-ci="${ci}"></td>`;return;}const chips=list.map(ch=>{const s=champSlugs[ch.n]||ch.n.toLowerCase().replace(/[^a-z0-9]/g,"");return`<span class="ch ${costCls[ch.c]}${selected.has(ch.n)?" selected":""}" data-n="${ch.n}"><img class="portrait" src="${CBASE}${s}.png?v=5" alt="${ch.n}" loading="lazy" onerror="this.style.display='none'"><span>${ch.n}</span></span>`;}).join("");h+=`<td data-ri="${ri}" data-ci="${ci}"><div class="cell">${chips}</div></td>`;});h+=`</tr>`;});
  h+=`</tbody>`;tbl.innerHTML=h;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{applyScale(curScale);updateVisuals();}));
}
const tblWrap=document.getElementById("tblScaler");
tblWrap.addEventListener("click",e=>{const chip=e.target.closest(".ch");if(chip){e.stopPropagation();toggleSelect(chip.dataset.n);}});
document.getElementById("cchips").addEventListener("click",e=>{const tag=e.target.closest("[data-desel]");if(tag)toggleSelect(tag.dataset.desel);});
tblWrap.addEventListener("mouseover",e=>{
  if(dragType)return;
  const chip=e.target.closest(".ch"),clsCell=e.target.closest("[data-cl]"),originTh=e.target.closest("[data-o]");
  if(chip){champTT(chip.dataset.n,e);return;}
  if(clsCell){const cl=clsCell.dataset.cl;if(cl&&cl!=="None")traitTT(cl,classBP[cl],"Class",e);else hideTT();return;}
  if(originTh){const o=originTh.dataset.o;if(o&&o!=="Unique")traitTT(o,originBP[o],"Origin",e);else hideTT();return;}
  hideTT();
});
tblWrap.addEventListener("mousemove",e=>{if(ttEl.style.display!=="none")moveTT(e);});
tblWrap.addEventListener("mouseleave",()=>{hideTT();clearHover();});
tblWrap.addEventListener("mouseover",e=>{if(dragType)return;clearHover();const cell=e.target.closest("td,th");if(!cell)return;const tbl=document.getElementById("tbl");const ri=cell.dataset.ri,ci=cell.dataset.ci;if(ri!==undefined){const tr=tbl.querySelector(`tr[data-ri="${ri}"]`);if(tr)tr.classList.add("row-hover");}if(ci!==undefined){tbl.querySelectorAll(`[data-ci="${ci}"]`).forEach(el=>el.classList.add("col-hover"));const th=tbl.querySelector(`th[data-ci="${ci}"]`);if(th)th.classList.add("col-hover");}},true);
function clearHover(){const tbl=document.getElementById("tbl");if(!tbl)return;tbl.querySelectorAll(".row-hover,.col-hover").forEach(el=>el.classList.remove("row-hover","col-hover"));}
let dragType=null,dragIdx=null,overIdx=null;
tblWrap.addEventListener("dragstart",e=>{const tr=e.target.closest("tr[data-ri]"),th=e.target.closest("th[data-ci]");if(tr&&!e.target.closest(".ch")){dragType="row";dragIdx=+tr.dataset.ri;tr.classList.add("dragging-row");e.dataTransfer.effectAllowed="move";}else if(th){if(th.dataset.o==="Unique")return e.preventDefault();dragType="col";dragIdx=+th.dataset.ci;th.classList.add("dragging-col");e.dataTransfer.effectAllowed="move";}});
tblWrap.addEventListener("dragend",()=>{dragType=null;dragIdx=null;overIdx=null;render();});
tblWrap.addEventListener("dragover",e=>{if(!dragType)return;e.preventDefault();const tbl=document.getElementById("tbl");if(dragType==="row"){const tr=e.target.closest("tr[data-ri]");if(!tr)return;const ri=+tr.dataset.ri;if(ri===overIdx)return;tbl.querySelectorAll(".drag-over-row").forEach(el=>el.classList.remove("drag-over-row"));tr.classList.add("drag-over-row");overIdx=ri;}else{const th=e.target.closest("th[data-ci]");if(!th)return;const ci=+th.dataset.ci;if(ci===overIdx)return;tbl.querySelectorAll(".drag-over-col").forEach(el=>el.classList.remove("drag-over-col"));th.classList.add("drag-over-col");overIdx=ci;}});
tblWrap.addEventListener("drop",e=>{if(!dragType||overIdx===null||dragIdx===overIdx)return;e.preventDefault();if(dragType==="row"){const moved=rowOrder.splice(dragIdx,1)[0];rowOrder.splice(overIdx,0,moved);}else{if(colOrder[overIdx]==="Unique")return;const moved=colOrder.splice(dragIdx,1)[0];colOrder.splice(overIdx,0,moved);}});
render();
</script>
